<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="description" content="TenderNest — build a checked, correctly ordered tender submission PDF in your browser. No upload, no server." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600&display=swap" rel="stylesheet" />
    <title>TenderNest</title>
    <style>
      /* Critical first-paint intro (ShopZen / R Slash style) — before JS/CSS load */
      .intro-stage{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0A0A0B;
        --intro-zoom-at:2200ms;--intro-zoom-ms:900ms;--intro-reveal-at:2500ms;--intro-fade-ms:700ms;--tile:112px}
      @media (min-width:640px){.intro-stage{--tile:136px}}
      .intro-content{display:flex;flex-direction:column;align-items:center;gap:18px;transform-origin:50% calc(var(--tile)/2)}
      .intro-mark{position:relative;width:var(--tile);height:var(--tile)}
      .intro-glow{pointer-events:none;position:absolute;inset:-140%;background:radial-gradient(circle,rgba(150,238,251,.28),rgba(168,188,161,.12) 35%,transparent 62%);opacity:0}
      .intro-word{margin:0;font:600 28px/1 Geist,-apple-system,system-ui,sans-serif;letter-spacing:-.03em;color:#F5F5F7}
      @media (min-width:640px){.intro-word{font-size:32px}}
      @media (prefers-reduced-motion:reduce){.intro-stage{display:none!important}}
      html:has(.intro-stage:not([data-done])){overflow:hidden}
    </style>
  </head>
  <body>
    <div class="intro-stage" id="intro" aria-hidden="true">
      <div class="intro-content">
        <div class="intro-mark" aria-hidden="true">
          <div class="intro-glow"></div>
          <!-- tile -->
          <div class="intro-piece" style="--fy:0%;--fr:-12deg;--origin:50% 50%;--d:80ms">
            <svg viewBox="0 0 64 64" class="intro-svg" overflow="visible">
              <defs>
                <linearGradient id="intro-tile" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#3A3A3C"/><stop offset="1" stop-color="#1D1D1F"/>
                </linearGradient>
              </defs>
              <rect width="64" height="64" rx="16" fill="url(#intro-tile)"/>
              <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="14.75" fill="none" stroke="#fff" stroke-opacity=".08"/>
            </svg>
          </div>
          <!-- nest -->
          <div class="intro-piece" style="--fy:38%;--fr:18deg;--origin:50% 72%;--d:340ms">
            <svg viewBox="0 0 64 64" class="intro-svg" overflow="visible">
              <defs>
                <linearGradient id="intro-nest" x1="32" y1="34" x2="32" y2="54" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#C5D6BF"/><stop offset="1" stop-color="#8FA98A"/>
                </linearGradient>
                <pattern id="intro-weave" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
                  <path d="M0 3h6" stroke="#4F6A47" stroke-width=".7" opacity=".4"/>
                  <path d="M3 0v6" stroke="#4F6A47" stroke-width=".55" opacity=".25"/>
                </pattern>
              </defs>
              <path d="M11 37.5c2.4 10.2 11 16 21 16s18.6-5.8 21-16c-3.4 5.2-10.8 8.6-21 8.6S14.4 42.7 11 37.5Z" fill="url(#intro-nest)"/>
              <path d="M11 37.5c2.4 10.2 11 16 21 16s18.6-5.8 21-16c-3.4 5.2-10.8 8.6-21 8.6S14.4 42.7 11 37.5Z" fill="url(#intro-weave)"/>
              <path d="M14.5 36.2c2 7.6 8.8 12 17.5 12s15.5-4.4 17.5-12" fill="none" stroke="#4F6A47" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
              <path d="M18 35c1.6 5.4 6.8 8.6 14 8.6s12.4-3.2 14-8.6" fill="none" stroke="#FFFDF9" stroke-width="1.1" stroke-linecap="round" opacity=".35"/>
              <g fill="#FFFDF9" opacity=".28">
                <circle cx="18" cy="42.5" r=".7"/><circle cx="24.5" cy="46.2" r=".55"/><circle cx="32" cy="47.8" r=".7"/>
                <circle cx="39.5" cy="46" r=".55"/><circle cx="46" cy="42.2" r=".7"/>
              </g>
            </svg>
          </div>
          <!-- back paper -->
          <div class="intro-piece" style="--fy:-28%;--fr:-160deg;--origin:40% 40%;--d:220ms">
            <svg viewBox="0 0 64 64" class="intro-svg" overflow="visible">
              <defs>
                <linearGradient id="intro-paper" x1="20" y1="18" x2="44" y2="40" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#FFFDF9"/><stop offset="1" stop-color="#E8E4DA"/>
                </linearGradient>
              </defs>
              <g transform="translate(22.5 16) rotate(-9)">
                <rect width="19" height="24" rx="2.2" fill="url(#intro-paper)"/>
                <path d="M4 6.5h11M4 10.5h11M4 14.5h8" stroke="#1B1B1B" stroke-opacity=".28" stroke-width="1.2" stroke-linecap="round"/>
              </g>
            </svg>
          </div>
          <!-- front paper -->
          <div class="intro-piece" style="--fy:-34%;--fr:140deg;--origin:58% 42%;--d:460ms">
            <svg viewBox="0 0 64 64" class="intro-svg" overflow="visible">
              <g transform="translate(27.5 18.5) rotate(8)">
                <rect width="19" height="24" rx="2.2" fill="#FFFDF9"/>
                <rect width="19" height="24" rx="2.2" fill="none" stroke="#1B1B1B" stroke-opacity=".1"/>
                <path d="M4 6.5h11M4 10.5h11M4 14.5h7" stroke="#4F6A47" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/>
                <path d="M5.5 19.2 8.2 21.6 13.8 15.8" fill="none" stroke="#4F6A47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </g>
            </svg>
          </div>
          <!-- accent dot -->
          <div class="intro-dot" style="--origin:76% 24%">
            <svg viewBox="0 0 64 64" class="intro-svg" overflow="visible">
              <defs>
                <linearGradient id="intro-dot" x1="46" y1="10" x2="54" y2="20" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#96EEFB"/><stop offset="1" stop-color="#5BC4D6"/>
                </linearGradient>
              </defs>
              <circle cx="49" cy="15" r="4.2" fill="url(#intro-dot)"/>
              <circle cx="49" cy="15" r="4.2" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width=".8"/>
            </svg>
          </div>
        </div>
        <div class="intro-word-wrap"><p class="intro-word">TenderNest</p></div>
      </div>
    </div>

    <main id="app"><noscript>Please enable JavaScript to use TenderNest.</noscript></main>
    <script type="module" src="/src/main.js"></script>
    <script>
      (function () {
        var stage = document.getElementById('intro');
        if (!stage) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          stage.setAttribute('data-done', '');
          stage.style.display = 'none';
          return;
        }
        var doneAt = 2500 + 700 + 80;
        setTimeout(function () {
          stage.setAttribute('data-done', '');
          stage.style.display = 'none';
          document.documentElement.style.removeProperty('--intro-offset');
        }, doneAt);
      })();
    </script>
  </body>
</html>
